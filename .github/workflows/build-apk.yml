name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      # The vendored NewBlackbox engine compiles as Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release & Debug APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare APK File for Release
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/*.apk ./parallel-space-clone.apk

      - name: Publish Release APK to GitHub Release
        uses: softprops/action-gh-release@v2
        # Only main publishes the "latest" release; branch runs just upload artifacts
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          name: "Parallel Space Clone (Latest Build)"
          body: "Automated Android Release APK generated from commit ${{ github.sha }}."
          draft: false
          prerelease: false
          files: parallel-space-clone.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ParallelSpace-Release-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ParallelSpace-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
