// Vendored from github.com/ALEX5402/NewBlackbox (Apache-2.0). See ../VENDOR.md.
// Rewritten for our AGP 9 / Gradle 9 build; upstream used AGP 8 DSL.
apply plugin: 'com.android.library'

android {
    namespace 'top.niunaijun.blackbox'

    // Upstream builds against 35; the hooks track that API level.
    compileSdk 35

    aidlPackagedList "android/app/IServiceConnection.aidl"
    aidlPackagedList "android/accounts/IAccountManagerResponse.aidl"

    buildFeatures {
        aidl true
        prefab true
    }

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        consumerProguardFiles "consumer-rules.pro"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    ndkVersion = "29.0.13846066"
    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-deprecation" << "-Xlint:-unchecked" << "-Xlint:-rawtypes"
    options.fork = true
    options.forkOptions.jvmArgs << "-Xmx2048m"
}

// Strip the AIDL-generated "Using: ..." comment line which contains backslash sequences
// that Java's compiler mis-parses as Unicode escapes on Windows paths.
tasks.matching { it.name.startsWith('compileReleaseJavaWithJavac') || it.name.startsWith('compileDebugJavaWithJavac') }.configureEach {
    doFirst {
        def aidlOut = layout.buildDirectory.dir("generated/aidl_source_output_dir").get().asFile
        if (aidlOut.exists()) {
            aidlOut.eachFileRecurse { f ->
                if (f.name.endsWith('.java')) {
                    def content = f.text
                    if (content.contains(' * Using:')) {
                        f.text = content.replaceAll(/(?m)^ \* Using:.*$/, '')
                    }
                }
            }
        }
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}

dependencies {
    implementation 'com.google.android.material:material:1.3.0'
    implementation(project(":black-reflection"))
    annotationProcessor(project(":compiler"))
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
}
